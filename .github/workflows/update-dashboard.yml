name: Update Karhutla Dashboard

on:
  schedule:
    # Every day at 07:00 WIB (00:00 UTC)
    - cron: "0 0 * * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "karhutla-dashboard"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # =====================================================
      # 1. Get repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # 3. Install scraper dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 4. Run Karhutla scraper
      # =====================================================

      - name: Run Karhutla scraper
        run: |
          python scraper/scrape_karhutla_2026.py

      # =====================================================
      # 5. Validate generated data
      # =====================================================

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/karhutla_2026.json"),
              Path("data/province_metrics.json"),
              Path("data/source_registry.json"),
          ]

          for path in files:
              if not path.exists():
                  raise SystemExit(f"Missing generated file: {path}")

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"Valid JSON: {path}")
          PY

      # =====================================================
      # 6. Show generated files
      # =====================================================

      - name: Check generated data
        run: |
          echo "Generated files:"
          ls -lh data/

          echo ""
          echo "Main JSON:"
          ls -lh data/karhutla_2026.json

          echo ""
          echo "Province metrics:"
          ls -lh data/province_metrics.json

          echo ""
          echo "Source registry:"
          ls -lh data/source_registry.json

      # =====================================================
      # 7. Commit updated scraper data
      # =====================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/karhutla_2026.json
          git add data/province_metrics.json
          git add data/source_registry.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Auto update Karhutla dashboard data"
            git push
          fi

      # =====================================================
      # 8. Configure GitHub Pages
      # =====================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # 9. Upload dashboard
      # =====================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # =====================================================
      # 10. Deploy dashboard
      # =====================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
